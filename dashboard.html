<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <!-- CSS Files -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- chart.js -->
     <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="navbar-container"></div>

    <div class="main-layout" style="display: flex;">
        <div id="sidebar-container"></div>
        
        <div class="content" id="content">
           <div class="page-header">
                    <h1 id="t-dash-title">Tableau de Bord</h1>
                </div>

                <div class="kpi-cards-grid">
                    <div class="kpi-card">
                        <div class="card-icon" style="background-color: #27ae6020;">
                            <i class="fa fa-dollar-sign" style="color: #27ae60;"></i>
                        </div>
                        <div class="card-content">
                            <span class="card-title" id="t-kpi-rev">Total des Revenus</span>
                            <span class="card-value" id="kpi-total-revenue">0 DH</span>
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="card-icon" style="background-color: #2980b920;">
                            <i class="fa fa-calendar-check" style="color: #2980b9;"></i>
                        </div>
                        <div class="card-content">
                            <span class="card-title" id="t-kpi-res">Réservations</span>
                            <span class="card-value" id="kpi-total-reservations">0</span>
                        </div>
                    </div>
                    
                    <div class="kpi-card">
                        <div class="card-icon" style="background-color: #8e44ad20;">
                            <i class="fa fa-users" style="color: #8e44ad;"></i>
                        </div>
                        <div class="card-content">
                            <span class="card-title" id="t-kpi-cli">Clients Enregistrés</span>
                            <span class="card-value" id="kpi-total-clients">0</span>
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="card-icon" style="background-color: #f39c1220;">
                            <i class="fa fa-bed" style="color: #f39c12;"></i>
                        </div>
                        <div class="card-content">
                            <span class="card-title" id="t-kpi-av-rooms">Chambres Disponibles</span>
                            <span class="card-value" id="kpi-available-rooms">0 / 0</span>
                        </div>
                    </div>
                    
                    <div class="kpi-card">
                        <div class="card-icon" style="background-color: #d3540020;">
                            <i class="fa fa-chart-pie" style="color: #d35400;"></i>
                        </div>
                        <div class="card-content">
                            <span class="card-title" id="t-kpi-occ">Taux d'Occupation</span>
                            <span class="card-value" id="kpi-occupancy-rate">0%</span>
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="card-icon" style="background-color: #c0392b20;">
                            <i class="fa fa-tags" style="color: #c0392b;"></i>
                        </div>
                        <div class="card-content">
                            <span class="card-title" id="t-kpi-avg">Prix Moyen / Nuit</span>
                            <span class="card-value" id="kpi-avg-price">0 DH</span>
                        </div>
                    </div>
                </div>
                <div class="charts-grid">
                    <div class="chart-container">
                        <h3 id="t-chart-status">Statut des Chambres</h3>
                        <canvas id="roomStatusChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3 id="t-chart-revenue">Revenus Mensuels</h3>
                        <canvas id="monthlyRevenueChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3 id="t-chart-type">Réservations par Type</h3>
                        <canvas id="roomTypeChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3 id="t-chart-trend">Tendance (7 jours)</h3>
                        <canvas id="reservationsTrendChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3 id="t-chart-performance">Aperçu de Performance</h3>
                        <canvas id="performanceRadarChart"></canvas>
                    </div>
                </div>
                </main>
            <div id="footer-container"></div>
        </div>
    </div>
  
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/base.js" defer></script> 
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
