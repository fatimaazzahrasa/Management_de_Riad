<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détails de la Réservation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="main-layout" style="display: flex">
        <div id="sidebar-container"></div>
        <div class="content">
            <div class="page-header">
                <h1>Fiche de Réservation</h1>
                <button class="add-btn" id="download-pdf" style="background-color: #e74c3c;">
                    <i class="fa fa-file-pdf"></i> Exporter en PDF
                </button>
            </div>

            <div class="details-card" id="invoice-content">
                <div class="details-header">
                    <div class="brand">
                        <h2 id="res-id-title">Réservation #---</h2>
                        <div id="res-status-container"></div>
                    </div>
                    <div class="company-info">
                        <strong>RIAD MANAGEMENT SYSTEM</strong><br>
                        Service de Réservation<br>
                        Marrakech, Maroc
                    </div>
                </div>

                <div class="info-section">
                    <h3><i class="fa fa-user"></i> Informations du Client</h3>
                    <div class="info-grid">
                        <div class="info-item"><label>Nom complet :</label><span id="det-client">---</span></div>
                        <div class="info-item"><label>Email :</label><span id="det-email">client@mail.com</span></div>
                    </div>
                </div>

                <div class="info-section">
                    <h3><i class="fa fa-bed"></i> Détails de l'Hébergement</h3>
                    <div class="info-grid">
                        <div class="info-item"><label>Chambre :</label><span id="det-room">---</span></div>
                        <div class="info-item"><label>Type :</label><span>Standard / Suite</span></div>
                        <div class="info-item"><label>Date d'Arrivée :</label><span id="det-start">---</span></div>
                        <div class="info-item"><label>Date de Départ :</label><span id="det-end">---</span></div>
                         <div class="info-item"><label>Prix par Nuit :</label><span id="det-price-night">0.00 DH</span></div>
                        <div class="info-item"><label>Nombre de Nuits :</label><span id="det-nights">0</span></div>
                    </div>
                </div>

                <div class="total-section">
                    <div class="total-box">
                        <label>Montant Total à Payer</label>
                        <span id="det-total">0.00 DH</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

     <script src="assets/js/storage.js"></script>
    <script src="assets/js/base.js" defer></script> 
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/res_details.js" defer></script>
</body>
</html>
