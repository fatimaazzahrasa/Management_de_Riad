<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détails de la chambre</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <h1>Détails de la chambre</h1>

    <div id="details"></div>

    <button onclick="window.history.back()">Retour</button>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/rooms.js"></script>
    <script>
        let params = new URLSearchParams(window.location.search);
        let roomId = parseInt(params.get("id"));
        let room = storage.getRooms().find(r => r.id === roomId);

        if(room){
            document.getElementById("details").innerHTML = `
                <p>Numéro: ${room.number}</p>
                <p>Prix: ${room.price} DH</p>
                <p>Statut: ${room.status}</p>
            `;
        } else {
            document.getElementById("details").innerHTML = "<p>Chambre non trouvée</p>";
        }
    </script>
    
</body>
</html>
